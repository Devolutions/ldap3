[package]
name = "ldap3_wasm"
version.workspace = true
authors.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.64"
tracing-subscriber = "0.3.17"
wasm-bindgen = { version = "0.2.87", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4.37"
web-sys = { version = "0.3.64", features = ["Performance"] }
ldap3_proto = { workspace = true, features = ["serde"] }
serde-wasm-bindgen = "0.6.1"
ws_stream_wasm = "0.7.4"
async_io_stream = { version = "0.3.3", features = ["tokio", "tokio_io"] }
framed = "0.4.3"
tokio-util = { version = "0.7.10", features = ["codec"] }
tokio = { workspace = true, features = ["io-util"] }
futures-util = "0.3.29"
serde.workspace = true
wasm-bindgen-test = "0.3.38"
serde_json.workspace = true
tracing.workspace = true
wasm-tracing = "2.0.0"
anyhow = "1.0.75"
tsify = { version = "0.4.5", features = ["js"] }
uuid = { version = "1.5.0", features = ["serde"] }
enum-assoc = "1.1.0"
regex = "1.10.2"
getrandom = { version = "0.2.11", features = ["js"] }
reqwest-wasm = "0.11.16"
gloo-net = "0.5.0"
time = { version = "0.3", features = ["wasm-bindgen"] }
thiserror.workspace = true
typed-builder = "0.18.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
sspi.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sspi = { workspace = true, features = ["network_client"] }

[dev-dependencies]
uuid = "1.5.0"
